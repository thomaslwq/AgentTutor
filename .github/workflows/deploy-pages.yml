name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 锁文件在 Windows 生成，缺失 Linux 平台可选依赖（@emnapi/*），npm ci 会失败；
      # 改用 npm install 让 CI 按当前平台补齐可选依赖
      - run: npm install --no-audit --no-fund

      # 标准 vite 构建（绕过 MiaoDa 平台的 build.sh），
      # CLIENT_BASE_PATH 同时驱动 vite base 与 router basename
      - name: Build
        run: npx vite build
        env:
          CLIENT_BASE_PATH: /AgentTutor/

      # 替换 HTML 模板占位符（标准 vite build 不走 MiaoDa 平台的元数据注入）。
      # 必须全部替换：__BASENAME__ 若残留 "{{basename}}" 会覆盖路由前缀导致白屏
      - name: Fill HTML metadata
        run: |
          sed -i \
            -e 's|{{{appAvatar}}}|/AgentTutor/tutors/chenmo-avatar.jpg|g' \
            -e 's|{{appAvatar}}|/AgentTutor/tutors/chenmo-avatar.jpg|g' \
            -e 's|{{appName}}|AgentTutor 数字人导师|g' \
            -e 's|{{appDescription}}|AI 数字人导师培训平台|g' \
            -e 's|{{basename}}|/AgentTutor/|g' \
            -e 's|{{environment}}|production|g' \
            -e 's|{{appId}}||g' \
            -e 's|{{userId}}||g' \
            -e 's|{{tenantId}}||g' \
            -e 's|{{userName}}||g' \
            -e 's|{{csrfToken}}||g' \
            dist/client/index.html
          grep -c '{{' dist/client/index.html || echo "all placeholders replaced"

      # SPA 刷新兜底：Pages 上访问子路由时回退到 index.html
      - name: SPA 404 fallback
        run: cp dist/client/index.html dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
